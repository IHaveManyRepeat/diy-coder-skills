# diy-test-gate 静态资产：ADR Quality Readiness Checklist（8 类 29 条）
#
# 来源：bmad-testarch-nfr/resources/knowledge/adr-quality-readiness-checklist.md
#       （源文标题「Standardized 8-category, 29-criteria framework」）
# 用途：steps/04-nfr.md 的证据走查清单；gate.py 读 rows 长度做 adr.rows 重算基准。
# 纪律：criterion 是**问句**——答案只能是「有证据 / 无证据」，不猜阈值；
#       strong 线（≥26/29）只进展示与 recommendations，不进 gate 判据。
rows:
  - {id: '1.1', category: testability-automation, criterion: 'Isolation：服务能否在全部下游依赖（DB / API / 队列）mock 或 stub 的条件下测试'}
  - {id: '1.2', category: testability-automation, criterion: 'Headless Interaction：业务逻辑是否 100% 可经 API（REST / gRPC）调用，绕开 UI'}
  - {id: '1.3', category: testability-automation, criterion: 'State Control：是否有 seeding API / 脚本可即时注入指定数据状态'}
  - {id: '1.4', category: testability-automation, criterion: 'Sample Requests：设计文档是否给出合法与非法 cURL / JSON 样例请求'}
  - {id: '2.1', category: test-data-strategy, criterion: 'Segregation：是否支持多租户或专用头（如 x-test-user）把测试数据隔离出生产指标'}
  - {id: '2.2', category: test-data-strategy, criterion: 'Generation：是否可用合成数据，还是依赖脱敏生产数据（GDPR / PII 风险）'}
  - {id: '2.3', category: test-data-strategy, criterion: 'Teardown：破坏性测试后是否有环境重置 / 数据清理机制'}
  - {id: '3.1', category: scalability-availability, criterion: 'Statelessness：服务是否无状态；有状态时会话状态如何跨实例复制'}
  - {id: '3.2', category: scalability-availability, criterion: 'Bottlenecks：高负载下最弱环节（DB 连接、API 限流）是否已识别'}
  - {id: '3.3', category: scalability-availability, criterion: 'SLA Definitions：目标可用性（如 99.9%）是否明确，架构是否支持冗余'}
  - {id: '3.4', category: scalability-availability, criterion: 'Circuit Breakers：依赖故障时服务是快速失败还是挂起'}
  - {id: '4.1', category: disaster-recovery, criterion: 'RTO/RPO：恢复时间目标与恢复点目标是否明确且被架构支持'}
  - {id: '4.2', category: disaster-recovery, criterion: 'Failover：区域 / 可用区故障切换是自动还是手动，是否演练过'}
  - {id: '4.3', category: disaster-recovery, criterion: 'Backups：备份是否不可变，且演练过恢复完整性'}
  - {id: '5.1', category: security, criterion: 'AuthN/AuthZ：是否实现标准协议（OAuth2 / OIDC），权限是否最小化且粒度合理'}
  - {id: '5.2', category: security, criterion: 'Encryption：静态数据（DB）与传输数据（TLS）是否加密'}
  - {id: '5.3', category: security, criterion: 'Secrets：密钥 / 口令是否存于 Vault（而非代码或配置文件）'}
  - {id: '5.4', category: security, criterion: 'Input Validation：输入是否按注入攻击（SQLi / XSS）净化'}
  - {id: '6.1', category: monitorability, criterion: 'Tracing：是否传播 W3C Trace Context / Correlation ID 以支持分布式追踪'}
  - {id: '6.2', category: monitorability, criterion: 'Logs：日志级别（INFO / DEBUG）能否动态切换而不重新部署'}
  - {id: '6.3', category: monitorability, criterion: 'Metrics：是否暴露 RED 指标（Rate / Errors / Duration）给 Prometheus / Datadog'}
  - {id: '6.4', category: monitorability, criterion: 'Config：配置是否外置，能否不重新构建就改变行为'}
  - {id: '7.1', category: qos-qoe, criterion: 'Latency (QoS)：P95 / P99 延迟目标是否明确'}
  - {id: '7.2', category: qos-qoe, criterion: 'Throttling (QoS)：是否有速率限制以挡「吵闹邻居」或 DDoS'}
  - {id: '7.3', category: qos-qoe, criterion: 'Perceived Performance (QoE)：加载时 UI 是否给乐观更新或骨架屏'}
  - {id: '7.4', category: qos-qoe, criterion: 'Degradation (QoE)：服务变慢时给友好提示还是裸栈回溯'}
  - {id: '8.1', category: deployability, criterion: 'Zero Downtime：设计是否支持蓝绿或金丝雀部署'}
  - {id: '8.2', category: deployability, criterion: 'Backward Compatibility：DB 变更能否与代码变更分开部署'}
  - {id: '8.3', category: deployability, criterion: 'Rollback：部署后健康检查失败时是否有自动回滚触发'}
threshold:
  strong: 26            # ≥26/29 = strong foundation（源 nfr-report-template.md）
  room_for_improvement: 20
