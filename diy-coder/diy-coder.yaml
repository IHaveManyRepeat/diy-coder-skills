# diy-coder-skill 全局配置 — 所有 diy-* skill 共享读取
project:
  name: diy-coder-skill
  communication_language: zh-CN      # 会话交流语言
  document_output_language: zh-CN    # 产物文档语言

paths:
  output_dir: diy-output             # 所有 YAML 单一源产物目录（相对项目根）
  view_dir: .view                    # HTML 投影目录（一次性生成物，可随时删除）
  experience_repo: ""                # 可选：全局经验库路径（独立 git 仓库的本地 clone，如 ~/.diy-coder/experience）
                                     # 留空则只用项目级 bug-log.yaml；配置后跨项目共享 bug 模式

viewer:
  auto_open: true                    # 仅人工交互终端渲染时自动打开；AI/自动化环境静默
